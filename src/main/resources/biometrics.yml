lifecycle:
  # The human twin birth rate in the United States rose 76% from 1980 through 2009, from 18.9 to 33.3 per 1,000 births.
  # - http://www.cdc.gov/nchs/data/databriefs/db80.pdf
  prevalence_of_twins:        0.02  # 20 per 1000
  # http://www.nhlbi.nih.gov/news/press-releases/2010/trials-use-technology-to-help-young-adults-achieve-healthy-weights
  # "Previous NHLBI research has shown that people aged 18-49 gain an average of 1-2 pounds each year"
  adult_weight_gain:          [1.0,2.0] # kilograms per year (this is more than 1-2 pounds, but we want obese people since we don't account for other factors effecting weight-gain)
  adult_max_weight_age:         49      # age (years) when adults stop packing on weight
  # http://www.aafp.org/afp/2014/0501/p718.html
  geriatric_weight_loss_age:    60      # age (years) when elderly begin to lose weight (between 60-70)
  geriatric_weight_loss:      [1.0,2.0] # kilograms per year (this is more than the citation, but our people are severely overweight)
  sexual_orientation:   [96.6, 1.6, 0.7]  # % - heterosexual, homosexual, bisexual, ref: http://www.cdc.gov/nchs/data/nhsr/nhsr077.pdf
metabolic:
  blood_pressure:
    normal:
      systolic: [100,139] # mmHg
      diastolic: [70,89]  # mmHg
    hypertensive:
      systolic: [140,160,200] # mmHg
      diastolic: [90,120] # mmHg
    # used when lifecycle.vitals.blood_pressure.model = continuous (ContinuousBloodPressureGenerator).
    # The resting level is the stock one (the ranges above, hypertension drugs, lifestyle care plan).
    # slow/fast: mean-reverting deviations (time constant; SD in mmHg), measurement_sd: per-minute noise.
    # Each is shared with the other value with this correlation. The SDs add up to the stock
    # generator's variation (systolic 8, diastolic 5), so readings outside stays have the same spread.
    # nocturnal_dip: each person's dip at the trough, as a share of the level, drawn once (normal with
    # mean and sd, clipped to [0, max]); it applies during stays (inpatient, SNF, hospice), as a raised
    # cosine around dip_trough_hour (local time) that is 0 beyond dip_half_width_hours. Normal dipping is
    # 10-20% of the daytime level (O'Brien et al., Lancet 1988) and is blunted in many inpatients.
    # max_diastolic_share: the diastolic level is kept softly below this share of the systolic level.
    # The stock ranges are drawn separately, so many people get a narrow pulse pressure (< 25% of
    # systolic, rare in adults: diastolic is about 0.6 of systolic on average); with the level at most
    # 0.7, readings narrower than 25% come only from short-term variation. Each diastolic reading is
    # also kept at least min_pulse_pressure (mmHg) below the systolic one.
    # Placeholder values, not yet calibrated against observed inpatient data.
    continuous:
      slow_tau_hours: 48
      fast_tau_hours: 2
      correlation: 0.7
      systolic: {slow_sd: 5.0, fast_sd: 5.0, measurement_sd: 3.7}
      diastolic: {slow_sd: 3.0, fast_sd: 3.0, measurement_sd: 2.6}
      nocturnal_dip: {mean: 0.10, sd: 0.05, max: 0.2}
      dip_trough_hour: 3
      dip_half_width_hours: 6
      max_diastolic_share: 0.7
      min_pulse_pressure: 10
  lipid_panel: #https://www.nlm.nih.gov/medlineplus/magazine/issues/summer12/articles/summer12pg6-7.html
    cholesterol:   [160,200,239,259,279,300] # mg/dL
    triglycerides: [100,150,199,499,550,600] # mg/dL
    hdl:           [ 80, 59, 40, 20, 10,  0] # mg/dL
  basic_panel:
    # Basic Metabolic Panel results: https://www.nlm.nih.gov/medlineplus/ency/article/003462.htm
    # Comprehensive Metabolic Panel results: https://www.nlm.nih.gov/medlineplus/ency/article/003468.htm
    normal:
      urea_nitrogen: [7,20] # mg/dL
      carbon_dioxide: [20,29] # mmol/L
      creatinine: [0.8,1.2] # mg/dL
      chloride: [101,111] # mmol/L
      potassium: [3.7,5.2] # mEq/L
      sodium: [136, 144] # mEq/L
      calcium: [8.5,10.2] # mg/dL
    # http://www.cdc.gov/diabetes/prevention/pdf/point-of-care-prediabetes-identification-algorithm_tag508.pdf
    glucose: [64,100,125,200] # mg/dL [normal minimum,prediabetic,diabetic,max]
    # http://www.mayomedicallaboratories.com/test-catalog/Clinical+and+Interpretive/81260
    microalbumin_creatinine_ratio:
      normal: [0,17] # mg/g
      microalbuminuria_controlled: [17,30] # mg/g
      microalbuminuria_uncontrolled: [30,300] # mg/g
      proteinuria: [300,600] # mg/g
    # http://www.mayomedicallaboratories.com/test-catalog/Clinical+and+Interpretive/8500
    # http://www.mayomedicallaboratories.com/test-catalog/Clinical+and+Interpretive/8472
    creatinine_clearance:
      normal: # Creatine clearance test results: https://www.nlm.nih.gov/medlineplus/ency/article/003611.htm
        male: [77,160] # ml/min/BSA
        female: [56,161] # ml/min/BSA
      mild_kidney_damage: [60,90] # ml/min/BSA
      moderate_kidney_damage: [30,59] # ml/min/BSA
      severe_kidney_damage: [15,29] # ml/min/BSA
      esrd: [1,15] # ml/min/BSA
cardiovascular:
  # used when lifecycle.vitals.body_temperature.model = continuous (ContinuousBodyTemperatureGenerator), degrees
  # Celsius. Afebrile outpatient readings average 36.6 with 95% in 35.7-37.3 (35,488 patients, mean age 53, 64%
  # women; Obermeyer et al., BMJ 2017), so the SDs add up to 0.4 and baseline_mean + female_offset * 0.64 + the
  # rhythm at clinic_hour gives 36.6. How that spread divides among the SDs is a placeholder. Temperature falls
  # with age and women run a little higher: the directions are published, the sizes placeholders.
  # The rhythm is a cosine of rhythm_amplitude, per person (normal with rhythm_amplitude_sd), lowest around 06:00
  # and highest 16:00-18:00, about 0.5 from trough to peak (Mackowiak et al., JAMA 1992). It follows the local hour
  # during stays (inpatient, SNF, hospice); elsewhere it is read at clinic_hour, because a person's timestep events
  # all fall at one time of day.
  body_temperature:
    continuous:
      baseline_mean: 36.52
      baseline_sd: 0.18
      female_offset: 0.05
      age_slope_per_decade: -0.03
      reference_age: 53
      rhythm_amplitude: 0.25
      rhythm_amplitude_sd: 0.05
      rhythm_peak_hour: 17
      clinic_hour: 12
      slow_sd: 0.1
      slow_tau_hours: 48
      fast_sd: 0.25
      fast_tau_hours: 4
      measurement_sd: 0.2
  oxygen_saturation:
    normal: [90,99] # https://www.mayoclinic.org/symptoms/hypoxemia/basics/definition/sym-20050930
    hypoxemia: [75,89] # https://en.wikipedia.org/wiki/Oxygen_saturation_(medicine)#Medical_significance
    # used when lifecycle.vitals.oxygen_saturation.model = continuous (ContinuousOxygenSaturationGenerator).
    # deficit below 100 = (personal deficit + age + conditions) x slow x fast x night; healthy awake adults read
    # about 95-99 and fall a little with age (Apple Heart and Movement Study, npj Digit Med 2023). The personal
    # deficit is log-normal, the deviations are log-normal factors (a sicker patient swings more), measurement_sd is
    # per-minute noise. night_factor: the deficit grows by this share at the trough during stays, a raised cosine
    # around night_trough_hour.
    # oxygen: in an inpatient, nursing, hospice or emergency encounter, once the room-air level (without the fast
    # deviation, so a patient does not flicker on and off) is below start_below (guidelines start oxygen below 90 in
    # acute heart failure), efficacy of the gap to target is closed over ramp_hours from the start of the encounter,
    # so the first reading is on room air. A lift below min_lift counts as none, so nobody is on a trickle of oxygen
    # (2 L/min by nasal cannula, about 28%, is a typical start). The oxygen concentration is 21 + fio2_per_point * lift +
    # fio2_per_point_squared * lift^2 (placeholder: about 28% for a lift of 4 points, 40% for 8).
    # acute_encounter: an emergency or inpatient encounter whose reason is one of these chronic conditions (Synthea
    # records no separate exacerbation) adds this deficit: strongest at arrival, falling with resolution_hours to
    # residual, scaled by a severity drawn per encounter. An acute MI cohort read 95 / 92 / 85 by Killip class
    # 1 / 2 / 3 (Rev Esp Cardiol 2012); a typical heart failure admission here arrives near 92.
    # Other values are placeholders, not yet calibrated against observed inpatient data.
    continuous:
      baseline_deficit_median: 2.3
      baseline_deficit_log_sd: 0.3
      age_slope_per_decade: 0.2
      age_slope_from: 40
      slow_log_sd: 0.15
      slow_tau_hours: 48
      fast_log_sd: 0.2
      fast_tau_hours: 2
      measurement_sd: 0.7
      night_factor: 0.4
      night_trough_hour: 3
      night_half_width_hours: 6
      combination_weight: 0.5
      oxygen:
        start_below: 90
        softness: 0.5
        target: 94
        efficacy: 0.9
        ramp_hours: 1
        min_lift: 1
        fio2_per_point: 1.0
        fio2_per_point_squared: 0.15
      acute_encounter:
        # Chronic congestive heart failure; Heart failure; Chronic obstructive bronchitis; Pulmonary emphysema
        codes: ['88805009', '84114007', '185086009', '87433001']
        deficit: 5
        resolution_hours: 48
        residual: 0.2
        severity_sd: 0.4
  # stroke:
  #   #https://www.heart.org/idc/groups/heart-public/@wcm/@sop/@smd/documents/downloadable/ucm_449858.pdf
  #   rate_20_39: [0.002, 0.007] #Prevalence of stroke by age and sex (Male, Female)
  #   rate_40_59: [0.019, 0.022]
  #   death: 0.15 #Strokes are fatal 10-20 percent of cases https://stroke.nih.gov/materials/strokechallenges.htm
  # chd:
  #   #http://www.ncbi.nlm.nih.gov/pmc/articles/PMC1647098/pdf/amjph00262-0029.pdf
  #   coronary_attack_risk: [0.042,0.015] #annual probability of coronary attack given history of angina (Male, Female)
  #   mi_proportion: 0.8 #Proportion of coronary attacks that are MI ,given history of CHD
  #   survive: 0.095 #http://cpr.heart.org/AHAECC/CPRAndECC/General/UCM_477263_Cardiac-Arrest-Statistics.jsp (0.095)
  #   bystander: 0.46 #http://cpr.heart.org/AHAECC/CPRAndECC/AboutCPRFirstAid/CPRFactsAndStats/UCM_475748_CPR-Facts-and-Stats.jsp
  # #http://circ.ahajournals.org/content/early/2014/12/18/CIR.0000000000000152.full.pdf
  # sudden_cardiac_arrest: #annual probability of risk of sudden cardiac arrest and death. Used as risk of cardiac event w/o CHD
  #   risk: 0.00076
  #   death: 0.00069
  heart_rate: # https://www.columbiadoctors.org/condition/vital-signs-body-temperature-pulse-rate-respiration-rate-blood-pressure
    normal: [60, 100]
    # used when lifecycle.vitals.heart_and_respiration_rate.model = continuous
    # (ContinuousVitalSignGenerator). Values are reflected into "normal"; the per-person baseline is
    # uniform inside "normal" shrunk by baseline_margin (a fraction of its width) on each side.
    # slow/fast: mean-reverting deviations (SD, time constant); measurement_sd: per-minute noise.
    # Placeholder values, not yet calibrated against observed inpatient data.
    continuous:
      baseline_margin: 0.1
      slow_sd: 5.0
      slow_tau_hours: 48
      fast_sd: 4.0
      fast_tau_hours: 4
      measurement_sd: 2.0
respiratory:
  respiration_rate: # https://www.columbiadoctors.org/condition/vital-signs-body-temperature-pulse-rate-respiration-rate-blood-pressure
    normal: [12, 16]
    continuous: # see cardiovascular.heart_rate.continuous
      baseline_margin: 0.1
      slow_sd: 0.6
      slow_tau_hours: 48
      fast_sd: 0.6
      fast_tau_hours: 4
      measurement_sd: 0.5
# Bounds of heart and respiration rate once conditions and medications act on them (the "continuous"
# values above stay inside "normal" without them), and of continuous blood pressure.
vital_sign_effect_bounds:
  heart_rate: [30, 220]
  respiration_rate: [6, 60]
  systolic_blood_pressure: [50, 250]
  diastolic_blood_pressure: [25, 150]
  body_temperature: [33, 42]
  oxygen_saturation: [50, 100]
# How conditions raise heart and respiration rate (ConditionVitalSignEffects). Used by the continuous
# model when lifecycle.vitals.heart_and_respiration_rate.condition_effects = true.
# Each effect adds its offset while one of its conditions (SNOMED codes, as recorded in the health
# record) is active, from the time the condition is recorded. When the condition ends the offset decays
# with time constant recovery_hours. An effect with max_days is acute: it also ends when the encounter
# the condition was recorded in ends, and at the latest max_days after onset, because Synthea never
# ends some acute conditions (e.g. sepsis.json leaves "Sepsis" active for life). Effects without
# max_days are chronic. Several active effects combine sub-additively: largest first at full weight,
# then each next one times combination_weight once more (0.5: 1, 1/2, 1/4, ...).
# Course (lifecycle.vitals.heart_and_respiration_rate.condition_course): an acute effect with
# resolution_hours (a number, or one per vital sign) is strongest at onset and falls towards residual (a
# share of its offset) with that time constant once treated. With treated_by (drug classes of
# vital_sign_drug_classes.csv), treatment starts with the first such medication recorded from
# treatment_window_hours before onset, and until then the effect falls untreated_factor times slower;
# without treated_by it falls from onset. The course never depends on when the encounter ends.
# Severity (lifecycle.vitals.heart_and_respiration_rate.condition_severity): each episode's offsets are
# multiplied by a log-normal factor with mean 1 and log-SD severity_sd, drawn per person, effect and
# onset and shared by heart and respiration rate.
# Magnitudes and courses are clinically plausible placeholders unless a source is given: e.g. fever
# ~ +8-10 bpm per degree C (Liebermeister's rule); sepsis puts a typical patient above the SIRS cut-offs
# (heart rate > 90, respiration rate > 20).
# Blood pressure (lifecycle.vitals.blood_pressure.model = continuous, condition_effects = true):
# systolic_blood_pressure and diastolic_blood_pressure act on the resting level as a factor, not in mmHg:
# the combined offset is the natural log of the factor (-0.32 = x0.73, a quarter lower), so a hypertensive
# patient falls as far as a normotensive one in proportion, and severe episodes and several effects
# compound towards 0 instead of below it. Septic shock puts a typical normotensive patient at a mean
# arterial pressure below 65 mmHg at onset (Sepsis-3 shock criterion) with a shock index (heart rate /
# systolic) above 1; sepsis alone leaves MAP near 85.
# Body temperature (lifecycle.vitals.body_temperature.model = continuous): body_temperature is an offset in
# degrees C. reversal: a share of episodes act with another offset instead, drawn per person, effect and onset:
# in a severe sepsis cohort 26% were at or below 36.5 (160 of 624; Kushimoto et al., Crit Care 2013). Pneumonia is
# calibrated to a median of 3 days to 37.2 or below (Halm et al., JAMA 1998). Other sizes are clinically plausible
# placeholders. Oxygen saturation (lifecycle.vitals.oxygen_saturation.model = continuous): oxygen_saturation is
# in points of saturation (negative lowers it). Pneumonia is calibrated to 28% of admissions at or below 90 on room
# air (Bewick et al., Prim Care Respir J 2010) and a median of 3 days to 90 or above (Halm et al.). Other sizes
# are placeholders. Effects with neither heart_rate nor respiration_rate leave those two untouched.
vital_sign_condition_effects:
  recovery_hours: 12
  combination_weight: 0.5
  severity_sd: 0.4
  untreated_factor: 3
  treatment_window_hours: 24
  effects:
    septic_shock:
      codes: ['76571007', '27942005'] # Septic shock; Shock
      body_temperature: 1.4
      oxygen_saturation: -4
      reversal: {body_temperature: {share: 0.25, offset: -1.2}}
      heart_rate: 35
      respiration_rate: 9
      systolic_blood_pressure: -0.32
      diastolic_blood_pressure: -0.42
      max_days: 5
      resolution_hours: 24
      residual: 0.1
      treated_by: [antibiotic]
    sepsis:
      # Sepsis; Sepsis caused by virus; by Pseudomonas; by Staphylococcus aureus; Postoperative
      # sepsis; Bacteremia
      codes: ['91302008', '770349000', '448813005', '448417001', '698819004', '5758002']
      body_temperature: 1.6
      oxygen_saturation: -2
      reversal: {body_temperature: {share: 0.25, offset: -1.0}}
      heart_rate: 25
      respiration_rate: 7
      systolic_blood_pressure: -0.08
      diastolic_blood_pressure: -0.10
      max_days: 14
      resolution_hours: 48
      residual: 0.1
      treated_by: [antibiotic]
    ards:
      codes: ['67782005'] # Acute respiratory distress syndrome
      body_temperature: 0.8
      oxygen_saturation: -12
      heart_rate: 20
      respiration_rate: 14
      max_days: 14
      resolution_hours: 96
      residual: 0.2
    respiratory_failure:
      codes: ['65710008', '271825005'] # Acute respiratory failure; Respiratory distress
      body_temperature: 0.3
      oxygen_saturation: -10
      heart_rate: 15
      respiration_rate: 10
      max_days: 10
      resolution_hours: 48
      residual: 0.1
    pneumonia:
      # Calibrated to community-acquired pneumonia admissions (Halm et al., JAMA 1998): with these
      # values an average admission is at about heart rate 100 and respiration rate 26, and patients
      # above heart rate 100 / respiration rate 24 at admission reach a day whose worst reading is at
      # or below it after a median of 2 / 3 days on antibiotics (VitalSignEffectsRealismTest).
      codes: ['233604007']
      body_temperature: 1.4
      oxygen_saturation: -4.2
      heart_rate: 20
      respiration_rate: 12
      max_days: 14
      resolution_hours: {heart_rate: 36, respiration_rate: 144, body_temperature: 48, oxygen_saturation: 216}
      residual: 0.1
      treated_by: [antibiotic]
    hypoxemia:
      codes: ['389087006']
      oxygen_saturation: -9
      heart_rate: 10
      respiration_rate: 5
      max_days: 14
      resolution_hours: 48
      residual: 0.1
    pulmonary_embolism:
      codes: ['706870000'] # Acute pulmonary embolism
      body_temperature: 0.5
      oxygen_saturation: -3
      heart_rate: 20
      respiration_rate: 6
      max_days: 7
      resolution_hours: 48
      residual: 0.1
      treated_by: [anticoagulant]
    fever:
      codes: ['386661006'] # Fever (finding), about 1.5 degrees C
      body_temperature: 1.5
      heart_rate: 13
      respiration_rate: 3
      max_days: 7
      resolution_hours: 36
      treated_by: [antipyretic]
    perforated_appendix:
      codes: ['47693006'] # Rupture of appendix
      body_temperature: 1.4
      heart_rate: 18
      respiration_rate: 4
      max_days: 7
      resolution_hours: 48
      residual: 0.1
      treated_by: [antibiotic]
    acute_abdominal_or_renal_infection:
      codes: ['74400008', '65275009', '45816000'] # Appendicitis; Acute cholecystitis; Pyelonephritis
      body_temperature: 1.0
      heart_rate: 12
      respiration_rate: 3
      max_days: 7
      resolution_hours: 36
      residual: 0.1
      treated_by: [antibiotic]
    acute_heart_failure:
      codes: ['84114007'] # Heart failure
      oxygen_saturation: -3
      heart_rate: 12
      respiration_rate: 5
      max_days: 14
      resolution_hours: 48
      residual: 0.2
      treated_by: [loop_diuretic]
    myocardial_infarction:
      # Myocardial infarction; Acute STEMI; Acute NSTEMI; Postoperative myocardial infarction
      codes: ['22298006', '401303003', '401314000', '129574000']
      body_temperature: 0.4
      oxygen_saturation: -1
      heart_rate: 10
      respiration_rate: 2
      max_days: 5
      resolution_hours: 36
      residual: 0.1
    hip_fracture:
      codes: ['359817006'] # Closed fracture of hip
      body_temperature: 0.3
      heart_rate: 8
      respiration_rate: 2
      max_days: 7
      resolution_hours: 72
      residual: 0.2
    chronic_heart_failure:
      codes: ['88805009'] # Chronic congestive heart failure
      oxygen_saturation: -1
      heart_rate: 5
      respiration_rate: 2
    atrial_fibrillation:
      codes: ['49436004']
      heart_rate: 12
    anemia:
      codes: ['271737000']
      heart_rate: 8
      respiration_rate: 1
    streptococcal_sore_throat:
      codes: ['43878008']
      body_temperature: 1.4
      max_days: 7
      resolution_hours: 48
      treated_by: [antibiotic]
    viral_respiratory_infection:
      # Acute viral pharyngitis; Acute bronchitis; Viral sinusitis; Sinusitis; Otitis media
      codes: ['195662009', '10509002', '444814009', '36971009', '65363002']
      body_temperature: 0.7
      max_days: 7
      resolution_hours: 48
    covid19:
      codes: ['840539006']
      body_temperature: 1.3
      oxygen_saturation: -4
      max_days: 21
      resolution_hours: 96
      residual: 0.1
    cystitis:
      codes: ['307426000'] # Acute infective cystitis, without fever unless it reaches the kidney
      body_temperature: 0.3
      max_days: 7
      resolution_hours: 36
      treated_by: [antibiotic]
    copd:
      codes: ['185086009', '87433001'] # Chronic obstructive bronchitis; Pulmonary emphysema
      oxygen_saturation: -3
    lung_cancer:
      codes: ['254637007', '254632001'] # Non-small cell lung cancer; Small cell carcinoma of lung
      oxygen_saturation: -2
# How medications change heart and respiration rate (MedicationVitalSignEffects). Used by the continuous
# model when lifecycle.vitals.heart_and_respiration_rate.medication_effects = true.
# vital_sign_drug_classes.csv assigns each drug code Synthea can prescribe to a class. For each vital sign
# a class lists a shift of the resting value and a blunting: the share of the rise from conditions it
# removes. A prescription acts from its start until it stops, then wears off with time constant
# washout_hours; a one-off dose (an administration) acts for administration_hours, or not at all without
# it. A person takes a prescribed class with probability adherence and responds by a factor drawn
# uniformly from response; both are fixed per person and class. Classes combine like condition effects:
# shifts sub-additively (combination_weight), bluntings multiplicatively.
# Sources: beta blockers lower resting heart rate by roughly 10-15 bpm (e.g. heart failure trials,
# McAlister et al., Ann Intern Med 2009); ivabradine by about 10 bpm (SHIFT, Swedberg et al., Lancet 2010);
# adherence to cardiovascular drugs is about 60% (Naderi et al., Am J Med 2012). Other values, the
# bluntings and the ophthalmic dose, are placeholders. Classes without a heart_rate or respiration_rate
# entry (antibiotic, ...) only time the course of conditions (treated_by).
vital_sign_medication_effects:
  combination_weight: 0.5
  classes:
    beta_blocker:
      heart_rate: {shift: -12, blunting: 0.3}
      adherence: 0.6
      response: [0.5, 1.5]
      washout_hours: 24
      administration_hours: 6
    ophthalmic_beta_blocker: # timolol eye drops, absorbed in small amounts
      heart_rate: {shift: -3}
      adherence: 0.6
      response: [0.5, 1.5]
      washout_hours: 24
    non_dhp_calcium_channel_blocker: # verapamil, diltiazem
      heart_rate: {shift: -7, blunting: 0.15}
      adherence: 0.6
      response: [0.5, 1.5]
      washout_hours: 24
    digoxin:
      heart_rate: {shift: -5, blunting: 0.1}
      adherence: 0.6
      response: [0.5, 1.5]
      washout_hours: 72
    ivabradine:
      heart_rate: {shift: -10, blunting: 0.2}
      adherence: 0.6
      response: [0.5, 1.5]
      washout_hours: 24
    antipyretic: # placeholder: brings a fever down partly, without acting on a normal temperature
      body_temperature: {shift: 0, blunting: 0.3}
      adherence: 0.8
      response: [0.5, 1.5]
      washout_hours: 6
      administration_hours: 6
weightloss:
  # https://www.ncbi.nlm.nih.gov/pmc/articles/PMC4990387/
  adherence: 0.605
  # For patients over 20, assuming adherence to weight management, loss of 7 - 10% of body weight
  # 20% chance of maintaining that loss after 5 years
  # https://academic.oup.com/ajcn/article/82/1/222S/4863393
  min_management_loss: 0.07
  max_management_loss: = 0.1
  maintenance: = 0.2

  # For patients under 20, weight loss will be controlled by change in BMI percentile.
  # This is the maximum change allowable to a patient's BMI percentile over the course of a year.
  max_ped_percentile_change: 0.1

  # Earliest age someone will try to lose weight
  min_age: 5
  # BMI at which someone will start to consider losing weight for patients over 20
  start_bmi: 30
  # BMI percentile at which someone will start to consider losing weight for patients under 20
  start_percentile: 0.95

  #https://www.cdc.gov/mmwr/volumes/67/wr/mm6741a10.htm?s_cid=mm6741a10_w
  start_prob: 0.493
